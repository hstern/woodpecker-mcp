name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: |
          bun install

      - name: BiomeJS
        run: |
          bun run lint:ci

      - name: Build
        run: |
          bun run build
